<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Hunter Area Command Meeting Rooms</title>

<style>

body{
    font-family: Arial, sans-serif;
    margin:0;
    padding:20px;
    background:#f2f2f2;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

h1{
    color:#006747;
    margin-bottom:5px;
}

.clock{
    font-size:20px;
    color:#444;
}

.calendars{
    display:flex;
    gap:20px;
    flex-wrap:wrap;
}

.room{
    flex:1;
    min-width:500px;
    background:#fff;
    border-radius:10px;
    padding:15px;
    box-shadow:0 2px 6px rgba(0,0,0,0.2);
}

.room h2{
    margin-top:0;
    text-align:center;
}

iframe{
    width:100%;
    height:700px;
    border:none;
}

.booking-button{
    display:block;
    margin:30px auto;
    width:350px;
    text-align:center;
    padding:20px;
    background:#006747;
    color:white;
    text-decoration:none;
    font-size:24px;
    font-weight:bold;
    border-radius:10px;
}

.booking-button:hover{
    background:#008756;
}

</style>

<script>

function updateClock() {
    document.getElementById('clock').innerHTML =
        new Date().toLocaleString();
}

setInterval(updateClock,1000);

let inactivityTimer;

function resetTimer() {

    clearTimeout(inactivityTimer);

    inactivityTimer = setTimeout(function() {

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

        location.reload();

    }, 900000);

}

document.addEventListener("mousemove", resetTimer);
document.addEventListener("touchstart", resetTimer);
document.addEventListener("click", resetTimer);
document.addEventListener("scroll", resetTimer);

window.onload = function() {
    updateClock();
    resetTimer();
};

</script>

</head>

<body>

<div class="header">
    <h1>Hunter Area Command Meeting Rooms</h1>
    <div id="clock" class="clock"></div>
</div>

<div class="calendars">

    <div class="room">
        <h2>Board Room</h2>

        <iframe
            src="https://outlook.office365.com/calendar/published/cc1d4aedcd024089919904295d38faca@rfs.nsw.gov.au/775196681e194c83886ae8d1873eec2f16040683340945229739/calendar.html">
        </iframe>

    </div>

    <div class="room">
        <h2>Quiet Room</h2>

        <iframe
            src="https://outlook.office365.com/calendar/published/4e09b6dd63224c2c9f7be08bf0b6e89d@rfs.nsw.gov.au/835fe6ab430540028ab1e18fb569ef1f3246045251603087374/calendar.html">
        </iframe>

    </div>

</div>

<a class="booking-button"
href="https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=Z-Nn5hRtYUmOtmFBdmN2FWcZ4TRXpJxNjccqyc2ZG61URE9PM1lLV1QzS1NCUTVFMFlXMEJTTU05UC4u"
target="_blank">
    Submit Booking Request
</a>

</body>
</html>
