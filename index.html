<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Area Hunter Meeting Rooms</title>

<style>

body{
    font-family: Arial, sans-serif;
    background:#f4f4f4;
    margin:0;
    padding:20px;
}

h1{
    text-align:center;
    color:#006747;
}

.room{
    background:white;
    margin-bottom:25px;
    padding:20px;
    border-radius:10px;
    box-shadow:0 2px 5px rgba(0,0,0,0.2);
}

h2{
    margin-top:0;
}

iframe{
    width:100%;
    height:700px;
    border:none;
}

.button{
    display:block;
    width:320px;
    margin:30px auto;
    padding:20px;
    text-align:center;
    background:#006747;
    color:white;
    text-decoration:none;
    font-size:22px;
    border-radius:10px;
}

.clock{
    text-align:center;
    font-size:24px;
    margin-bottom:20px;
}

</style>

<script>

let inactivityTimer;

function resetTimer() {

    clearTimeout(inactivityTimer);

    inactivityTimer = setTimeout(function () {

        window.scrollTo({
            top:0,
            behavior:"smooth"
        });

        location.reload();

    }, 900000);

}

document.addEventListener("mousemove", resetTimer);
document.addEventListener("touchstart", resetTimer);
document.addEventListener("click", resetTimer);
document.addEventListener("scroll", resetTimer);

window.onload = resetTimer;

function updateClock() {

    const now = new Date();

    document.getElementById("clock").innerHTML =
        now.toLocaleString();

}

setInterval(updateClock,1000);

</script>

</head>

<body onload="updateClock()">

<h1>Area Hunter Meeting Rooms</h1>

<div id="clock" class="clock"></div>

<div class="room">

<h2>Board Room</h2>

<iframe
src="https://outlook.office365.com/calendar/published/cc1d4aedcd024089919904295d38faca@rfs.nsw.gov.au/775196681e194c83886ae8d1873eec2f16040683340945229739/calendar.html">
</iframe>

</div>
